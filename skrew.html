<script>

'use strict';
const $=id=>document.getElementById(id);
let state=null,roomRef=null,roomId='',me='',online=false,listener=null,lastRoundSeen=0,busy=false,localAI=false,localTimer=null;
let temporaryOwn=new Set(),temporaryPower=null,revealTimer=null,visibleRoundKey=null;
function peekKey(g){return 'aq-skrew-peek-'+(roomId||'solo')+'-'+me+'-'+g.created+'-'+g.round;}
function peekDone(g){return sessionStorage.getItem(peekKey(g))==='1'}
function initialPeek(){const g=state;if(!g||!g.players?.[me]||g.status!=='playing'||g.round===5||peekDone(g))return;sessionStorage.setItem(peekKey(g),'1');temporaryOwn=new Set([0,1]);render();toast('احفظ الكارتين كويس! هيتقلبوا بعد 6 ثواني');clearTimeout(revealTimer);revealTimer=setTimeout(()=>{temporaryOwn.clear();render()},6000)}
function resetTemporary(){temporaryOwn.clear();temporaryPower=null;clearTimeout(revealTimer)}
function checkPowerReveal(g){if(!g||!me||g.status!=='playing'||!g.powerInfo||g.powerInfo.owner!==me)return;const inf=g.powerInfo;const marker='aq-skrew-power-'+(roomId||'solo')+'-'+me+'-'+g.created+'-'+g.round+'-'+inf.revision;if(sessionStorage.getItem(marker))return;sessionStorage.setItem(marker,'1');temporaryPower={reveals:inf.reveals||[],marker};temporaryOwn=new Set((inf.reveals||[]).filter(x=>x.player===me).map(x=>x.slot));clearTimeout(revealTimer);revealTimer=setTimeout(()=>{temporaryPower=null;temporaryOwn.clear();render()},6000);}

const config={apiKey:'AIzaSyAc21tJsinRp3I-op4gtthSj9SiZmQOt3I',authDomain:'basra-game-2995a.firebaseapp.com',databaseURL:'https://basra-game-2995a-default-rtdb.firebaseio.com',projectId:'basra-game-2995a',appId:'1:1024179389498:web:3ba98f053d49bfa1676103'};
let db=null;
function notice(t){$('networkLabel').textContent=t;}
function toast(t){const x=$('toast');x.textContent=t;x.className='';Object.assign(x.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',zIndex:100,background:'#1c1009',border:'1px solid #ecc47b',padding:'13px',borderRadius:'10px'});setTimeout(()=>x.className='hidden',3500);}
function openModal(x){$('dialog').innerHTML=x;$('overlay').classList.remove('hidden');}
function closeModal(){$('overlay').classList.add('hidden');}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
function copyText(s){navigator.clipboard?.writeText(s).then(()=>toast('✅ اتنسخ')).catch(()=>prompt('انسخ الكود',s));}
function makeDeck(){let out=[],k=0;const add=(value,power,count)=>{for(let j=0;j<count;j++)out.push({id:'s'+(k++),value,power:power||null})};for(let v=1;v<=6;v++)add(v,null,8);for(let v=7;v<=10;v++){const start=out.length;add(10,(v<9?'self':'opponent'),4);out.slice(start).forEach(c=>c.rank=v)}for(const [power,count] of [['swap',4],['round',3],['basra',3]])add(10,power,count);add(20,null,4);add(-1,null,4);add(20,'red',2);add(0,'driver',2);return shuffle(out)}
function newState(names,ids,limit){let deck=makeDeck(),players={};ids.forEach((id,i)=>{players[id]={name:names[i],hand:[deck.pop(),deck.pop(),deck.pop(),deck.pop()],seen:[0,1],score:0,ready:true,penalty:0}});return {type:'skrew',status:'playing',round:1,players,order:ids,turn:0,phase:'draw',deck,discard:[deck.pop()],drawn:null,drawnFrom:null,caller:null,lastTurns:0,history:[],target:limit||100,created:Date.now(),revision:0,winner:null,powerPending:null}}
function clean(s){if(!s)return null;s.deck=Array.isArray(s.deck)?s.deck:Object.values(s.deck||{});s.discard=Array.isArray(s.discard)?s.discard:Object.values(s.discard||{});s.order=Array.isArray(s.order)?s.order:Object.values(s.order||{});s.history=Array.isArray(s.history)?s.history:Object.values(s.history||{});for(const p of Object.values(s.players||{})){p.hand=Array.isArray(p.hand)?p.hand:Object.values(p.hand||{});p.seen=Array.isArray(p.seen)?p.seen:Object.values(p.seen||{});}return s;}
function current(){return state?.order?.[state.turn]}
function myTurn(){return !!state&&state.status==='playing'&&current()===me}
function remaining(){return state?.caller?state.lastTurns:0}
function getPid(){let k='aq-skrew-playerid';let v=localStorage.getItem(k);if(!v){v='p_'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem(k,v)}return v}
function safeCode(v){return String(v||'').trim().toUpperCase().replace(/^SKR[-_ ]?/,'').replace(/[^A-Z0-9]/g,'').slice(0,6)}
function newCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>a[rnd(a.length)]).join('')}
async function firebaseReady(){if(db)return db;for(let [url] of [['https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js'],['https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js']]){if(url.includes('database')&&window.firebase?.database)continue;if(url.includes('app-compat')&&window.firebase?.initializeApp)continue;await new Promise((r,j)=>{let x=document.createElement('script');x.src=url;x.onload=r;x.onerror=()=>j(new Error('تعذر تحميل Firebase'));document.head.append(x)})}if(!firebase.apps.length)firebase.initializeApp(config);db=firebase.database();return db}
function roomPath(code){return 'games/skrew_'+code}
function lobbyMarkup(){return `<h2>🃏 قعدة سكرو على القهوة</h2><p>العب ضد الكمبيوتر للتجربة أو اعمل قعدة أونلاين من 2 إلى 6 لاعبين، انسخ الكود وابعته لأصحابك.</p><div class="field"><label>اسمك</label><input id="nameInput" maxlength="20" value="${escapeHTML(localStorage.getItem('aq-skrew-name')||'محمد')}"></div><div class="field"><label>عدد اللاعبين في القعدة</label><select id="maxInput">${[2,3,4,5,6].map(n=>`<option value="${n}">${n} لاعبين</option>`).join('')}</select></div><div class="join-grid"><button class="primary" onclick="createRoom()">🌐 إنشاء قعدة أونلاين</button><div class="field"><label>معاك كود صاحبك؟</label><input id="joinCode" placeholder="SKR-ABC123" autocapitalize="characters" value="${safeCode(new URLSearchParams(location.search).get('room')||'')}"></div><button onclick="joinRoom()">✅ دخول بالكود</button><button onclick="startLocal()">🤖 تجربة ضد الكمبيوتر</button></div><p id="modalStatus" class="status"></p>`}
function escapeHTML(t){return String(t).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function showLobby(){resetTemporary();if(roomRef&&listener)roomRef.off('value',listener);roomRef=null;online=false;state=null;roomId='';localAI=false;openModal(lobbyMarkup());render()}
function enterName(){const x=$('nameInput');const name=x?.value.trim()||'لاعب';localStorage.setItem('aq-skrew-name',name);return name.slice(0,20)}
function msg(t){if($('modalStatus'))$('modalStatus').textContent=t}
async function createRoom(){const name=enterName(),max=Number($('maxInput').value);msg('بنعمل القعدة...');try{await firebaseReady();me=getPid();let code,ref;for(let attempt=0;attempt<6;attempt++){code=newCode();ref=db.ref(roomPath(code));const old=(await ref.once('value')).val();if(!old)break;}let waiting={type:'skrew',status:'waiting',host:me,max,players:{[me]:{name,joinedAt:Date.now()}},created:Date.now()};await ref.set(waiting);online=true;roomId=code;roomRef=ref;listen();showInvite();}catch(e){msg('فشل إنشاء القعدة: '+e.message)}}
function showInvite(){openModal(`<h2>✅ قعدة سكرو اتعملت</h2><p>ابعت الكود لأصحابك. صاحب القعدة يبدأ اللعب بعد ما يكتمل عدد اللاعبين، أو يختار البدء بالعدد الموجود.</p><div class="roomcode">SKR-${roomId}</div><div class="foot"><button class="primary" onclick="copyText('SKR-${roomId}')">📋 نسخ الكود</button><button onclick="copyInvite()">🔗 نسخ رابط الدعوة</button></div><div class="players-pills" id="waitingPlayers"></div><p id="waitingText" class="status">في انتظار أصحابك...</p><div class="foot"><button class="primary" id="startBtn" onclick="startOnline()">▶️ ابدأ القعدة</button><button onclick="closeModal()">إخفاء النافذة</button></div>`);updateWaiting();}
function copyInvite(){const u=new URL(location.href);u.searchParams.set('room',roomId);copyText(u.toString())}
function updateWaiting(){if(!state||state.status!=='waiting')return;const n=Object.keys(state.players||{}).length;if($('waitingPlayers'))$('waitingPlayers').innerHTML=Object.values(state.players||{}).map(p=>`<span>✅ ${escapeHTML(p.name)}</span>`).join('');if($('waitingText'))$('waitingText').textContent=`اتصل ${n} من ${state.max} لاعبين — ${n>=2?'تقدر تبدأ دلوقتي':'مستنيين لاعب تاني'}`;if($('startBtn'))$('startBtn').disabled=n<2;}
async function joinRoom(){const name=enterName(),code=safeCode($('joinCode')?.value);if(code.length!==6){msg('اكتب كود القعدة الصحيح المكون من 6 حروف وأرقام');return;}msg('جاري الانضمام...');try{await firebaseReady();me=getPid();const ref=db.ref(roomPath(code));let g=(await ref.once('value')).val();if(!g||g.type!=='skrew'){msg('القعدة مش موجودة؛ اطلب كود جديد');return;}if(g.status!=='waiting'&&!g.players?.[me]){msg('القعدة بدأت بالفعل ومش بتقبل لاعبين جدد');return;}if(!g.players?.[me]){if(Object.keys(g.players||{}).length>=g.max){msg('القعدة اكتملت');return;}await ref.child('players').child(me).set({name,joinedAt:Date.now()});let verify=(await ref.child('players').child(me).once('value')).val();if(!verify){msg('لم يتم تأكيد الانضمام من السيرفر');return;}}
roomId=code;roomRef=ref;online=true;listen();closeModal();toast('✅ دخلت القعدة!');}catch(e){msg('فشل الانضمام: '+e.message)}}
async function startOnline(){if(!online||!state||state.host!==me||state.status!=='waiting')return;const ids=Object.keys(state.players||{});if(ids.length<2){toast('لازم لاعبين على الأقل');return;}busy=true;try{let fresh=(await roomRef.once('value')).val();if(fresh.status!=='waiting')return;const ids2=Object.keys(fresh.players||{});const names=ids2.map(id=>fresh.players[id].name);const g=newState(names,ids2,100);g.host=me;g.max=fresh.max;await roomRef.set(g);closeModal();}catch(e){toast('تعذر بدء الجولة: '+e.message)}finally{busy=false}}
function listen(){if(listener&&roomRef)roomRef.off('value',listener);listener=snap=>{state=clean(snap.val());if(!state)return;render();if(state.status==='waiting'){if(state.host===me){if(!$('waitingPlayers'))showInvite();updateWaiting();}else{openModal(`<h2>✅ انضميت لقعدة سكرو</h2><p>في انتظار صاحب القعدة يبدأ اللعب.</p><div class="roomcode">SKR-${roomId}</div><p>المتصلين: ${Object.keys(state.players||{}).length} من ${state.max}</p><button onclick="closeModal()">إخفاء</button>`);}}else if(state.status==='playing'||state.status==='ended')closeModal()};roomRef.on('value',listener,e=>notice('خطأ الاتصال: '+e.message));}
function startLocal(){resetTemporary();me='human';localAI=true;online=false;roomId='';state=newState(['أنت','المعلم زكي'],[me,'bot'],100);closeModal();render();}
function isKnown(id,i){return state.players[id].seen.includes(i)}
function labelCard(c){if(!c)return '—';return c.rank?String(c.rank):({self:'7 أو 8',opponent:'9 أو 10',swap:'خد وهات',round:'كعب داير',basra:'البصرة',red:'سكرو أحمر',driver:'سكرو داريفر'})[c.power]||String(c.value)}
function card(c,show,onclick,mini=false){const x=document.createElement(onclick?'button':'div');x.className='card'+(show?' reveal known':' back')+(onclick?' pick':'');if(mini)x.style.pointerEvents='none';if(show){x.innerHTML=`<span>${escapeHTML(labelCard(c))}</span><small>${c.value} نقطة</small>`;}if(onclick)x.onclick=onclick;return x}
function render(){let g=state;if(g){const rk=g.created+":"+g.round;if(visibleRoundKey!==rk){resetTemporary();visibleRoundKey=rk;}checkPowerReveal(g);}$('modeLabel').textContent=online?'أونلاين':localAI?'ضد المعلم':'—';$('roomLabel').textContent=roomId?'SKR-'+roomId:'—';$('countLabel').textContent=Object.keys(g?.players||{}).length;$('roundLabel').textContent=g?.round||1;$('otherPlayers').replaceChildren();$('myCards').replaceChildren();if(!g){$('turnLabel').textContent='قعدة سكرو';$('statusLabel').textContent='اعمل قعدة علشان تبدأ';return}if(g.status==='waiting'){$('turnLabel').textContent='في انتظار أصحابك';$('statusLabel').textContent=`متصل ${Object.keys(g.players).length} من ${g.max}`;return}
for(const id of g.order){const p=g.players[id];if(!p)continue;if(id===me){$('selfLabel').textContent='😎 '+p.name+(g.turn===g.order.indexOf(id)?' • دورك':'');p.hand.forEach((c,i)=>$('myCards').appendChild(card(c,['ended','complete'].includes(g.status)||temporaryOwn.has(i),()=>clickOwn(i))));}else{let box=document.createElement('div');box.className='seat'+(id===current()?' active':'');box.innerHTML=`<b>🃏 ${escapeHTML(p.name)}</b><small>${p.hand.length} كروت • ${p.score||0} نقطة</small>`;let cards=document.createElement('div');cards.className='cards';p.hand.forEach((c,i)=>cards.appendChild(card(c,['ended','complete'].includes(g.status),null,true)));box.appendChild(cards);$('otherPlayers').appendChild(box);}}
$('initialPeekButton').style.display=g.status==='playing'&&g.round!==5&&!peekDone(g)?'':'none';$('deckLabel').textContent=g.deck.length+' كارت';const top=g.discard.at(-1);let d=card(top,!!top,null);d.id='discardButton';$('discardButton').replaceWith(d);d.onclick=()=>takeFrom('discard');d.style.cursor='pointer';$('deckButton').disabled=!myTurn()||g.phase!=='draw';$('throwButton').disabled=!myTurn()||g.phase!=='choice';$('powerButton').disabled=!myTurn()||g.phase!=='choice'||g.drawnFrom!=='deck'||!['self','opponent','swap','round','basra'].includes(g.drawn?.power);$('screwButton').disabled=!myTurn()||g.phase!=='draw'||g.round===0||g.caller!==null;$('nextButton').style.display=g.status==='ended'?'':'none';$('nextButton').disabled=online&&g.host!==me;
$('turnLabel').textContent=['ended','complete'].includes(g.status)?'الجولة خلصت':myTurn()?'دورك يا معلم':'دور '+(g.players[current()]?.name||'اللاعب');$('statusLabel').textContent=['ended','complete'].includes(g.status)?summary(g):g.phase==='draw'?'اسحب من الكومة أو خد الكارت المكشوف':g.phase==='choice'?'اختار كارت من إيدك للتبديل أو ارمي المسحوب':g.phase==='power'?'اختار كارت لاستخدام قدرة الباور':'مستنيين الحركة...';$('extraLabel').textContent=temporaryPower?'👀 كشف الباور (هيختفي بعد 6 ثواني): '+(temporaryPower.reveals||[]).map(x=>(g.players[x.player]?.name||'لاعب')+' كارت '+(x.slot+1)+' = '+x.value).join(' | '):g.caller?'📣 '+g.players[g.caller]?.name+' أعلن سكرو؛ باقي '+g.lastTurns+' أدوار':g.drawn&&myTurn()?'الكارت المسحوب: '+labelCard(g.drawn):'';notice(online?'🟢 متصل بالأونلاين':'🤖 ضد الكمبيوتر');if(localAI&&g.status==='playing'&&current()==='bot'&&!localTimer){localTimer=setTimeout(()=>{localTimer=null;botMove()},750)}}
function summary(g){return g.history.at(-1)?.message||'الجولة انتهت'}
function nextTurn(g){g.drawn=null;g.drawnFrom=null;g.powerPending=null;g.phase='draw';g.turn=(g.turn+1)%g.order.length;if(g.caller){g.lastTurns--;if(g.lastTurns<=0)finishRound(g)}return g}
function finishRound(g){const totals=Object.fromEntries(g.order.map(id=>[id,g.players[id].hand.reduce((a,c)=>a+(Number(c.value)||0),0)+(g.players[id].penalty||0)]));const low=Math.min(...Object.values(totals));const success=g.caller?totals[g.caller]===low:false;for(const id of g.order){const add=totals[id]*(id===g.caller&&!success?2:1);g.players[id].score=(g.players[id].score||0)+add;g.players[id].seen=g.players[id].hand.map((_,i)=>i)}let winners=g.order.filter(id=>totals[id]===low).map(id=>g.players[id].name).join(' و ');g.history.push({round:g.round,totals,caller:g.caller,success,message:`🏆 أقل نقاط: ${winners}${g.caller&&!success?' — سكرو فاشل، نقاط المعلن ×2':''}`});g.status=g.round>=5?'complete':'ended';g.phase='ended';if(g.status==='complete'){const ranking=[...g.order].sort((a,b)=>g.players[a].score-g.players[b].score);g.winner=ranking[0];g.history[g.history.length-1].message+=' | 🏆 بطل الخمس جولات: '+g.players[g.winner].name}}
function verifyTurn(g){return g&&g.status==='playing'&&currentFor(g)===me}
function currentFor(g){return g.order[g.turn]}
function apply(g,action,id){g=clean(g);if(!g||g.status!=='playing'||g.order[g.turn]!==id)throw Error('مش دورك دلوقتي');const p=g.players[id];
if(action.type==='draw'){if(g.phase!=='draw')throw Error('اسحب في بداية دورك');let c;if(action.from==='discard'){if(!g.discard.length)throw Error('كومة الرمي فاضية');c=g.discard.pop()}else{if(!g.deck.length){const t=g.discard.pop();g.deck=shuffle(g.discard);g.discard=t?[t]:[]}if(!g.deck.length)throw Error('مفيش كروت للسحب');c=g.deck.pop()}g.drawn=c;g.drawnFrom=action.from;g.phase='choice';}
else if(action.type==='throw'){if(g.phase!=='choice'||!g.drawn)throw Error('اسحب كارت الأول');g.discard.push(g.drawn);nextTurn(g)}
else if(action.type==='swap'){if(g.phase!=='choice'||!g.drawn)throw Error('اسحب كارت الأول');if(!Number.isInteger(action.slot)||action.slot<0||action.slot>=p.hand.length)throw Error('كارت غير صحيح');const old=p.hand[action.slot];p.hand[action.slot]=g.drawn;p.seen=p.seen.filter(x=>x!==action.slot);g.discard.push(old);nextTurn(g)}
else if(action.type==='power'){if(g.phase!=='choice'||!g.drawn||g.drawnFrom!=='deck'||!['self','opponent','swap','round','basra'].includes(g.drawn.power))throw Error('الباور يتفعل فقط لما تسحبه من كومة السحب');const power=g.drawn.power;const target=g.players[action.target];const index=Number(action.slot);if(power==='self'){if(!Number.isInteger(index)||index<0||index>=p.hand.length)throw Error('اختار كارت من ورقك');g.powerInfo={owner:id,reveals:[{player:id,slot:index,value:labelCard(p.hand[index])}],revision:g.revision+1};}
else if(power==='opponent'){if(!target||action.target===id||!Number.isInteger(index)||index<0||index>=target.hand.length)throw Error('اختار كارت من منافس');g.powerInfo={owner:id,reveals:[{player:action.target,slot:index,value:labelCard(target.hand[index])}],revision:g.revision+1};}
else if(power==='round'){let reveals=[];for(const other of g.order){const who=g.players[other];if(who.hand.length){let slot=action.slots&&Number.isInteger(action.slots[other])?action.slots[other]:0;slot=Math.max(0,Math.min(who.hand.length-1,slot));reveals.push({player:other,slot,value:labelCard(who.hand[slot])});if(other===id)p.seen=[...new Set([...p.seen,slot])];}}g.powerInfo={owner:id,reveals,revision:g.revision+1};}
else if(power==='swap'){if(!target||action.target===id||!Number.isInteger(index)||index<0||index>=target.hand.length||!Number.isInteger(action.mySlot)||action.mySlot<0||action.mySlot>=p.hand.length)throw Error('اختار كارت من عندك ومن منافس');[p.hand[action.mySlot],target.hand[index]]=[target.hand[index],p.hand[action.mySlot]];p.seen=p.seen.filter(x=>x!==action.mySlot);target.seen=target.seen.filter(x=>x!==index);}
else if(power==='basra'){if(!Number.isInteger(index)||index<0||index>=p.hand.length)throw Error('اختار كارت ترميه من إيدك');const removed=p.hand.splice(index,1)[0];g.discard.push(removed);p.seen=p.seen.filter(x=>x!==index).map(x=>x>index?x-1:x);}
g.discard.push(g.drawn);nextTurn(g)}
else if(action.type==='screw'){if(g.phase!=='draw'||g.caller)throw Error('مش وقت إعلان سكرو');g.caller=id;g.lastTurns=g.order.length;nextTurn(g)}else throw Error('حركة غير معروفة');g.revision=(g.revision||0)+1;return g}async function move(action){if(!myTurn()||busy){toast('استنى دورك يا معلم');return}busy=true;try{if(online){let err='';const serverState=(await roomRef.once('value')).val();if(!serverState)throw Error('القعدة مش موجودة');const tx=await roomRef.transaction(raw=>{if(!raw)return;try{return apply(raw,action,me)}catch(e){err=e.message;return}},undefined,false);if(!tx.committed){toast(err||'الحركة لم تتحفظ — حاول مرة ثانية');return;}}else{state=apply(state,action,me);render();}}catch(e){toast('تعذر حفظ الحركة: '+e.message)}finally{busy=false}}
function takeFrom(from){if(!myTurn()||state.phase!=='draw')return;move({type:'draw',from})}
function clickOwn(i){if(!myTurn())return;if(state.phase==='choice')move({type:'swap',slot:i});else toast('اسحب كارت الأول وبعدها اختار مكان التبديل')}
function throwDrawn(){move({type:'throw'})}
function callScrew(){if(confirm('تعلن سكرو؟ كل لاعب هيلعب دور أخير وبعدها نحسب النتيجة.'))move({type:'screw'})}
async function advanceRound(){if(!state||state.status!=='ended'||(online&&state.host!==me))return;try{const ids=state.order,names=ids.map(id=>state.players[id].name),scores=Object.fromEntries(ids.map(id=>[id,state.players[id].score]));let g=newState(names,ids,state.target);g.round=state.round+1;resetTemporary();g.history=state.history;g.host=state.host;g.max=state.max;for(const id of ids){g.players[id].score=scores[id]||0;g.players[id].seen=g.round===5?[]:[0,1];}if(online)await roomRef.set(g);else{state=g;render()}}catch(e){toast(e.message)}}
function botMove(){if(!localAI||!state||state.status!=='playing'||current()!=='bot')return;const a=state.phase==='draw'?{type:'draw',from:state.discard.length&&Math.random()<.25?'discard':'deck'}:state.phase==='choice'?Math.random()<.65?{type:'swap',slot:rnd(state.players.bot.hand.length)}:{type:'throw'}:null;if(a){try{state=apply(state,a,'bot');render()}catch(e){console.error(e)}}}
function openRules(){openModal(`<h2>📜 قواعد نيو سكرو — ع القهوة</h2><p>2–6 لاعبين، خمس جولات. أول أربع جولات كل لاعب يشوف كارتين فقط بالبداية؛ الجولة الخامسة عمياني، ولا يتم الكشف المبدئي.</p><p>7 و8: كشف كارت من عندك. 9 و10: كشف كارت من منافس. خد وهات: تبديل عمياني. كعب داير: كشف كارت من كل لاعب. البصرة: التخلص من أي كارت عندك. الباور يتفعل فقط لو اتسحب من الكومة؛ ولو ما استخدمتوش يترمي. كروت الباور داخل الإيد = 10 نقاط.</p><p>كروت +20 وسكرو الأحمر = 20، -1 = ناقص نقطة، سكرو داريفر = صفر. لو سكرو فشل نقاط معلنه تتضاعف، والتعادل في الأقل نجاح. بعد الخامسة أقل مجموع تراكمي يفوز.</p><p>في الجولات الأربع الأولى اضغط «شوف كارتين البداية» مرة واحدة؛ يظهر الكارتان 6 ثوانٍ ثم يتقلبان، ولا يمكنك كشفهما مجددًا إلا بباور مسموح. الجولة الخامسة عمياني بلا كشف ابتدائي. كروت 7 و8 و9 و10 وكعب داير تعمل في الخامسة.</p><button class="primary" onclick="closeModal()">تمام</button>`)}

function usePower(){if(!state||!myTurn()||state.phase!=='choice'||state.drawnFrom!=='deck')return;const power=state.drawn?.power;if(!['self','opponent','swap','round','basra'].includes(power))return;
const other=state.order.filter(id=>id!==me);const playerChoice=()=>{if(!other.length)return null;let text=other.map((id,i)=>(i+1)+' - '+state.players[id].name).join('\n');let n=Number(prompt('اختار رقم اللاعب المنافس:\n'+text,'1'));return other[n-1]||null;};
const slotChoice=(count,title)=>{let n=Number(prompt(title+' (من 1 إلى '+count+')','1'));return Number.isInteger(n)&&n>=1&&n<=count?n-1:null};
let action={type:'power'};if(power==='self'||power==='basra'){let slot=slotChoice(state.players[me].hand.length,power==='basra'?'اختار الكارت اللي هتتخلص منه':'اختار كارت تكشفه');if(slot===null)return;action.slot=slot;}
else if(power==='round'){action.slots={};for(const id of state.order){const slot=slotChoice(state.players[id].hand.length,'اختار كارت من '+state.players[id].name);if(slot===null)return;action.slots[id]=slot;}}
else{let target=playerChoice();if(!target)return;action.target=target;let slot=slotChoice(state.players[target].hand.length,'اختار كارت من '+state.players[target].name);if(slot===null)return;action.slot=slot;if(power==='swap'){const mySlot=slotChoice(state.players[me].hand.length,'اختار كارت منك للتبديل العمياني');if(mySlot===null)return;action.mySlot=mySlot;}}
move(action);
}

document.addEventListener('DOMContentLoaded',()=>{showLobby()});
</script></body></html>
