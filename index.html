<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راديو ع القهوة | مزاج رايق</title><style>
:root{color-scheme:dark;--gold:#eac17d;--bg:#17100d;--card:#2b1b15}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 10%,#523022 0,transparent 42%),linear-gradient(145deg,#1b120f,#0f0d0c);color:#ffeed4;font-family:Tahoma,Arial,sans-serif;padding:18px}.radio{width:min(100%,470px);padding:28px 24px 25px;border-radius:26px;background:linear-gradient(150deg,#322017,#201511);border:1px solid #a1764680;box-shadow:0 24px 80px #0008;text-align:center}.live{font-size:.8rem;color:#e9c993;letter-spacing:.2px}.dial{display:grid;place-items:center;margin:22px auto 14px;width:145px;height:145px;border-radius:50%;background:repeating-radial-gradient(circle,#5c3a26 0 3px,#2b1a15 4px 7px);box-shadow:inset 0 0 0 8px #9e7145,0 0 35px #d0984b32}.dial span{font-size:67px;filter:drop-shadow(0 4px 8px #0007)}h1{font-size:1.65rem;margin:7px 0}p{color:#c9b6a2;font-size:.9rem;line-height:1.8;margin:5px 0 17px}.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0}button{border:1px solid #b58c5c;background:#64452c;color:#fff0d7;font-size:1rem;cursor:pointer;border-radius:13px;padding:11px 16px}button.primary{height:70px;width:70px;border-radius:50%;background:linear-gradient(145deg,#f4d397,#be8648);color:#2e1b13;font-size:1.7rem;font-weight:bold;box-shadow:0 8px 20px #0005}button:focus-visible,input:focus-visible{outline:2px solid #f6da9d;outline-offset:3px}.volume{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px}.volume input{accent-color:#d9aa64;width:min(65%,225px)}.status{color:#eac17d;min-height:25px;font-size:.92rem}.foot{margin-top:18px;color:#9e8977;font-size:.78rem}.tiny{font-size:.78rem}.glow{animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{50%{box-shadow:inset 0 0 0 8px #b78a51,0 0 58px #d0984b74}}@media(max-width:390px){.radio{padding:25px 15px}h1{font-size:1.4rem}}
</style></head><body><main class="radio"><div class="live">☕ محطة موسيقى مستقلة من «ع القهوة»</div><div id="dial" class="dial"><span>📻</span></div><h1>راديو ع القهوة</h1><strong>🌙 مزاج رايق</strong><p>موسيقى هادية لقعدة حلوة وسهرة طويلة</p><div class="controls"><button id="mute" title="كتم أو تشغيل الصوت" aria-label="كتم أو تشغيل الصوت">🔊</button><button id="play" class="primary" aria-label="تشغيل الراديو">▶</button><button id="restart" title="تشغيل من البداية" aria-label="تشغيل من البداية">↺</button></div><div class="status" id="status" role="status">اضغط تشغيل علشان تبدأ الإذاعة</div><div class="volume"><label for="volume">الصوت</label><input id="volume" type="range" min="0" max="100" value="35" aria-label="مستوى الصوت"><span id="val">35%</span></div><div class="foot">تكرار تلقائي للمقطع بعد نهايته <span class="tiny">• حوالي 72 دقيقة</span></div><audio id="audio" src="ahwa-calm-radio.mp3" preload="metadata" loop></audio></main><script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),mute=document.getElementById('mute'),restart=document.getElementById('restart'),volume=document.getElementById('volume'),val=document.getElementById('val'),status=document.getElementById('status'),dial=document.getElementById('dial');audio.volume=.35;
function render(){const active=!audio.paused;play.textContent=active?'Ⅱ':'▶';play.setAttribute('aria-label',active?'إيقاف الراديو مؤقتًا':'تشغيل الراديو');status.textContent=active?'♫ المحطة شغالة — استمتع بالقعدة':'المحطة متوقفة مؤقتًا';dial.classList.toggle('glow',active);mute.textContent=audio.muted||audio.volume===0?'🔇':'🔊'}
play.addEventListener('click',async()=>{if(!audio.paused){audio.pause();render();return}try{await audio.play()}catch(e){status.textContent='تعذر تشغيل الملف. تأكد من وجود ملف الصوت بجانب الصفحة.'}render()});restart.addEventListener('click',()=>{audio.currentTime=0;if(audio.paused)audio.play().catch(()=>{});render()});mute.addEventListener('click',()=>{audio.muted=!audio.muted;render()});volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;audio.muted=false;val.textContent=volume.value+'%';render()});audio.addEventListener('play',render);audio.addEventListener('pause',render);audio.addEventListener('error',()=>{status.textContent='ملف الموسيقى غير متاح. ضعه بجوار index.html.'});render();
</script></body></html>
