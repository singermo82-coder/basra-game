    }
    // Stop old background music on the home page, without touching café sound effects or Shaabi FM.
    // Runs before the original page's inline scripts and event handlers.
    const noMusicGuard=dom.createElement('script');
    noMusicGuard.textContent=`
    (function(){
      const musicPattern=/(?:music|musical|soundtrack|background[-_ ]?(?:audio|song|music)|bgm|theme[-_ ]?(?:music|song)|موسيقى|أغاني|اغاني)/i;
      const isRadio=(el)=>!!(el&&((el.id||'').includes('ahwaShaabi')||el.dataset&&el.dataset.ahwaRadio==='true'));
      function isOldMusic(el){
        if(!el||isRadio(el))return false;
        const src=[el.currentSrc||'',el.src||'',el.getAttribute&&el.getAttribute('src')||'',el.id||'',el.className||''].join(' ');
        const longLoop=el.loop===true||el.hasAttribute&&el.hasAttribute('autoplay');
        return musicPattern.test(src)||longLoop;
      }
      const origPlay=HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play=function(){
        if(this.tagName==='AUDIO'&&isOldMusic(this)){
          try{this.pause();this.removeAttribute('autoplay');}catch(_){}
          return Promise.resolve();
        }
        return origPlay.apply(this,arguments);
      };
      function stopOldMusic(){
        document.querySelectorAll('audio').forEach(el=>{
          if(isOldMusic(el)){try{el.pause();el.autoplay=false;el.removeAttribute('autoplay')}catch(_){}}
        });
      }
      document.addEventListener('DOMContentLoaded',stopOldMusic,{once:true});
      window.addEventListener('load',stopOldMusic,{once:true});
      const mo=new MutationObserver(stopOldMusic);
      mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','autoplay','loop']});
      window.__ahwaNoBackgroundMusic=true;
    })();`;
    dom.head.prepend(noMusicGuard);
    let base=dom.head.querySelector('base');if(!base){base=dom.createElement('base');dom.head.prepend(base);}base.href='https://singermo82-coder.github.io/basra-game/';

    // Compact in-page Sha3by FM audio-only player. No station page or iframe.
    const style=dom.createElement('style');
    style.textContent=`
      #ahwaShaabiPlayer{position:fixed;left:12px;bottom:87px;z-index:45;direction:rtl;
      display:flex;align-items:center;gap:8px;padding:7px 10px;background:linear-gradient(140deg,#351a0d,#140a06);
      color:#fbe4ac;border:1px solid #c69648;border-radius:15px;box-shadow:0 8px 22px #000a;
      font:700 12px Tahoma,Arial,sans-serif;max-width:min(93vw,340px)}
      #ahwaShaabiPlayer .ahwa-radio-text{display:flex;flex-direction:column;gap:2px;min-width:88px}
      #ahwaShaabiPlayer .ahwa-radio-text small{color:#d7b98b;font-size:10px;font-weight:400}
      #ahwaShaabiPlayer button{border:1px solid #b78a48;color:#fbe7b3;border-radius:9px;
      background:#372213;padding:6px 10px;cursor:pointer;font-size:13px}
      #ahwaShaabiPlayer button.ahwa-radio-on{background:#08734d;color:white;border-color:#39b581}
      #ahwaShaabiPlayer input[type=range]{width:66px;accent-color:#d9ac5d;cursor:pointer}
      @media(max-width:680px){#ahwaShaabiPlayer{bottom:65px;left:5px;padding:5px 6px;gap:4px;
      font-size:10px;max-width:calc(100vw - 10px)}#ahwaShaabiPlayer input[type=range]{width:43px}
      #ahwaShaabiPlayer .ahwa-radio-text{min-width:60px}}
    `;
    dom.head.appendChild(style);
    const player=dom.createElement('div');
    player.id='ahwaShaabiPlayer';
    player.innerHTML='<span aria-hidden="true">📻</span><span class="ahwa-radio-text"><strong>شعبي FM 95</strong><small id="ahwaShaabiStatus">جاهز للتشغيل</small></span><button type="button" id="ahwaShaabiToggle" aria-label="تشغيل الراديو">▶ تشغيل</button><input id="ahwaShaabiVolume" aria-label="مستوى صوت الراديو" type="range" min="0" max="100" value="55">';
    dom.body.appendChild(player);
    const playerCode=dom.createElement('script');
    playerCode.textContent=`
    (function(){
      if(window.__ahwaShaabiReady)return;
      window.__ahwaShaabiReady=true;
      const stream='https://radio95.radioca.st/;';
      const audio=new Audio();audio.dataset.ahwaRadio='true';audio.preload='none';audio.volume=0.55;audio.src=stream;
      const button=document.getElementById('ahwaShaabiToggle');
      const status=document.getElementById('ahwaShaabiStatus');
      const volume=document.getElementById('ahwaShaabiVolume');
      if(!button||!status||!volume)return;
      let userStopped=false;
      function show(playing,msg){button.textContent=playing?'⏸ إيقاف':'▶ تشغيل';
        button.classList.toggle('ahwa-radio-on',playing);button.setAttribute('aria-label',playing?'إيقاف الراديو':'تشغيل الراديو');
        status.textContent=msg||(playing?'مباشر الآن':'جاهز للتشغيل');}
      async function play(){
        userStopped=false;
        show(false,'جاري الاتصال...');
        try{await audio.play();show(true,'🔴 مباشر الآن');}
        catch(e){show(false,e.name==='NotAllowedError'?'اضغط تشغيل للسماع':'تعذّر تشغيل البث');}
      }
      button.addEventListener('click',function(e){e.stopPropagation();if(!audio.paused){userStopped=true;audio.pause();show(false,'متوقف');}else play();});
      volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;});
      audio.addEventListener('playing',()=>show(true,'🔴 مباشر الآن'));
      audio.addEventListener('waiting',()=>show(false,'جاري التحميل...'));
      audio.addEventListener('error',()=>show(false,'البث غير متاح حاليًا'));
      audio.addEventListener('pause',()=>{if(userStopped)show(false,'متوقف');});
      // Browser autoplay rules: try once, then wait for first user gesture if blocked.
      play();
      document.addEventListener('pointerdown',function gesture(ev){
        if(!userStopped&&audio.paused&&!ev.target.closest('#ahwaShaabiPlayer'))play();
      },{capture:true,once:true});
      window.addEventListener('pagehide',()=>audio.pause());
    })();`;
    dom.body.appendChild(playerCode);

    // Adjust ONLY the two hero panels so their OUTER edges line up with the game cards.
    // The center game grid and its content are deliberately unchanged.
    const alignScript=dom.createElement('script');
    alignScript.textContent=`
    (()=>{
      const SELECTOR='[data-ahwa-header-aligned]';
      function exactLabel(text){return (text||'').replace(/\\s+/g,' ').trim();}
      function findText(needle){
        return [...document.querySelectorAll('body *')].find(e=>e.children.length===0 && exactLabel(e.textContent).includes(needle)) ||
          [...document.querySelectorAll('body *')].find(e=>e.children.length<3 && exactLabel(e.textContent)===needle);
      }
      function panelFor(label){
        const leaf=findText(label);if(!leaf)return null;
        let p=leaf;
        for(let i=0;i<7 && p && p!==document.body;i++,p=p.parentElement){
          const r=p.getBoundingClientRect();
          if(r.width>250 && r.height>55 && r.height<180 && r.top<240 &&
          (getComputedStyle(p).borderTopWidth!=='0px'||getComputedStyle(p).borderRadius!=='0px')) return p;
        }
        return leaf.closest('aside,article,section')||leaf.parentElement;
      }
      function gameCard(title){
        const heading=[...document.querySelectorAll('h2,h3,h4')].find(e=>exactLabel(e.textContent)===title);
        if(!heading)return null;
        let p=heading;
        for(let i=0;i<7&&p;i++,p=p.parentElement){
          const r=p.getBoundingClientRect();
          if(r.width>220 && r.width<600 && r.height>180 && r.height<600)return p;
        }
        return null;
      }
      function reset(p){if(p){p.style.removeProperty('width');p.style.removeProperty('max-width');p.style.removeProperty('translate');p.removeAttribute('data-ahwa-header-aligned')}}
      function align(){
        const hero=panelFor('قعدة ولعب على أصوله')||panelFor('ألعاب مصرية أونلاين');
        const call=panelFor('نداء القهوة')||panelFor('هات الشاي وتعالى');
        reset(hero);reset(call);
        const right=gameCard('بصرة'),left=gameCard('اللودو');
        if(!hero||!call||!right||!left||hero===call)return;
        const r=hero.getBoundingClientRect(),l=call.getBoundingClientRect();
        const targetRight=right.getBoundingClientRect().right;
        const targetLeft=left.getBoundingClientRect().left;
        // Preserve the inward-facing edge of each box; only expand/contract outward.
        const heroWidth=r.width+(targetRight-r.right);
        const callWidth=l.width+(l.left-targetLeft);
        if(heroWidth>250 && heroWidth<1800){hero.style.setProperty('width',heroWidth+'px','important');hero.style.setProperty('max-width','none','important');hero.dataset.ahwaHeaderAligned='true';}
        if(callWidth>260 && callWidth<850){call.style.setProperty('width',callWidth+'px','important');call.style.setProperty('max-width','none','important');call.style.setProperty('translate',(targetLeft-l.left)+'px 0','important');call.dataset.ahwaHeaderAligned='true';}
      }
      let timer;
      const schedule=()=>{clearTimeout(timer);timer=setTimeout(align,120)};
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{schedule();setTimeout(align,500)},{once:true});
      else {schedule();setTimeout(align,500)}
      window.addEventListener('resize',schedule,{passive:true});
    })();`;
    dom.body.appendChild(alignScript);

    document.open();document.write('<!doctype html>\n'+dom.documentElement.outerHTML);document.close();
  }catch(err){console.error('Home page loading failed:',err);const p=document.querySelector('#error');if(p)p.style.display='block';}
})();
</script></body></html>
