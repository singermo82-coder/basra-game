      const top=leaves.find(el=>/^(اللعبة الأصلية|لعبة متاحة|قريبًا في القعدة|العب الآن)$/u.test(el.textContent.trim()));
      if(top)top.textContent='العب الآن';
      const cta=leaves.find(el=>/^(قريبًا|العب الآن|العب الآن ←|← العب الآن)$/u.test(el.textContent.trim())&&el!==top);
      if(cta){cta.innerHTML='<span dir="rtl">العب الآن <span aria-hidden="true">←</span></span>';cta.style.setProperty('background','linear-gradient(180deg,#0fa775,#00694d)','important');cta.style.setProperty('border-color','#64dcb0','important');cta.style.setProperty('color','#fff','important');}

    // Stop old background music on the home page, without touching café sound effects or Shaabi FM.
    // Runs before the original page's inline scripts and event handlers.
    const noMusicGuard=dom.createElement('script');
    noMusicGuard.textContent=`
    (function(){
      const musicPattern=/(?:music|musical|soundtrack|background[-_ ]?(?:audio|song|music)|bgm|theme[-_ ]?(?:music|song)|موسيقى|أغاني|اغاني)/i;
      const isRadio=(el)=>!!(el&&((el.id||'').includes('ahwaShaabi')||el.dataset&&el.dataset.ahwaRadio==='true'));
      function isOldMusic(el){
        if(!el||isRadio(el))return false;
        const src=[el.currentSrc||'',el.src||'',el.getAttribute&&el.getAttribute('src')||'',el.id||'',el.className||''].join(' ');
        const longLoop=el.loop===true||el.hasAttribute&&el.hasAttribute('autoplay');
        return musicPattern.test(src)||longLoop;
      }
      const origPlay=HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play=function(){
        if(this.tagName==='AUDIO'&&isOldMusic(this)){
          try{this.pause();this.removeAttribute('autoplay');}catch(_){}
          return Promise.resolve();
        }
        return origPlay.apply(this,arguments);
      };
      function stopOldMusic(){
        document.querySelectorAll('audio').forEach(el=>{
          if(isOldMusic(el)){try{el.pause();el.autoplay=false;el.removeAttribute('autoplay')}catch(_){}}
        });
      }
      document.addEventListener('DOMContentLoaded',stopOldMusic,{once:true});
      window.addEventListener('load',stopOldMusic,{once:true});
      const mo=new MutationObserver(stopOldMusic);
      mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','autoplay','loop']});
      window.__ahwaNoBackgroundMusic=true;
    })();`;

    const player=dom.createElement('div');

    dom.body.appendChild(player);
    const playerCode=dom.createElement('script');
    playerCode.textContent=`
    (function(){
      if(window.__ahwaShaabiReady)return;
      window.__ahwaShaabiReady=true;
      const stream='https://radio95.radioca.st/;';
      const audio=new Audio();audio.dataset.ahwaRadio='true';audio.preload='none';audio.volume=0.55;audio.src=stream;
      const button=document.getElementById('ahwaShaabiToggle');
      const status=document.getElementById('ahwaShaabiStatus');
      const volume=document.getElementById('ahwaShaabiVolume');
      if(!button||!status||!volume)return;
      let userStopped=false;
      function show(playing,msg){button.textContent=playing?'⏸ إيقاف':'▶ تشغيل';
        button.classList.toggle('ahwa-radio-on',playing);button.setAttribute('aria-label',playing?'إيقاف الراديو':'تشغيل الراديو');
        status.textContent=msg||(playing?'مباشر الآن':'جاهز للتشغيل');}
      async function play(){
        userStopped=false;
        show(false,'جاري الاتصال...');
        try{await audio.play();show(true,'🔴 مباشر الآن');}
        catch(e){show(false,e.name==='NotAllowedError'?'اضغط تشغيل للسماع':'تعذّر تشغيل البث');}
      }
      button.addEventListener('click',function(e){e.stopPropagation();if(!audio.paused){userStopped=true;audio.pause();show(false,'متوقف');}else play();});
      volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;});
      audio.addEventListener('playing',()=>show(true,'🔴 مباشر الآن'));
      audio.addEventListener('waiting',()=>show(false,'جاري التحميل...'));
      audio.addEventListener('error',()=>show(false,'البث غير متاح حاليًا'));
      audio.addEventListener('pause',()=>{if(userStopped)show(false,'متوقف');});
      // Browser autoplay rules: try once, then wait for first user gesture if blocked.
      play();
